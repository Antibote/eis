# Миграции схемы БД EIS. Применяются автоматически при запуске (eis.db.session.init_db);
# вручную: cd backend && ../.venv/bin/alembic upgrade head
[alembic]
script_location = eis/db/migrations
prepend_sys_path = .

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s %(message)s
